<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVE_KOREA 공모전 관제판</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f7f9;color:#222;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
<p id="msg">관제판을 불러오는 중…</p>
<script>
(async function(){
  var SRC='https://bbgturlakkmkofnmdqpg.supabase.co/storage/v1/object/public/site/index.html';
  try{
    var r=await fetch(SRC+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    var html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('msg').textContent='관제판을 불러오지 못했습니다 ('+e.message+'). 잠시 뒤 새로고침해 주세요.';
  }
})();
</script>
</body>
</html>
